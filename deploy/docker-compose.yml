# Everything on one machine, for development and trying it out:
#   cp deploy/.env.example deploy/.env    (then set the secrets)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# Open http://localhost:8000. Add catalog models with:
#   docker compose -f deploy/docker-compose.yml exec api node apps/api/dist/src/cli/add-model.js /models/<file or folder> --kind onnx --license Apache-2.0
name: neuracraft
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neuracraft
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nc"]
      interval: 2s
      retries: 30

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile, target: api }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://nc:${POSTGRES_PASSWORD}@db:5432/neuracraft
      STORAGE_DIR: /data/storage
      SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY}
      WORKER_TOKENS: ${WORKER_TOKEN:?set WORKER_TOKEN}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROMPT_MODEL: ${PROMPT_MODEL:-claude-haiku-5-5}
      MODERATION_THRESHOLDS: ${MODERATION_THRESHOLDS:-nsfw=0.5}
      INTERACTIVE_REGIONS: ${INTERACTIVE_REGIONS:-}
      # The compose stack's worker is a CPU worker: let it take presets (slowly). Off in production.
      INTERACTIVE_ON_CPU: ${INTERACTIVE_ON_CPU:-1}
      CAPACITY_PROVIDER: ${CAPACITY_PROVIDER:-}
      CAPACITY_MAX_PODS: ${CAPACITY_MAX_PODS:-3}
      CAPACITY_DAILY_BUDGET_USD: ${CAPACITY_DAILY_BUDGET_USD:-10}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_IMAGE: ${RUNPOD_IMAGE:-}
      RUNPOD_GPU_TYPES: ${RUNPOD_GPU_TYPES:-}
      RUNPOD_CLOUD: ${RUNPOD_CLOUD:-SECURE}
      RUNPOD_DATA_CENTERS: ${RUNPOD_DATA_CENTERS:-}
      RUNPOD_NETWORK_VOLUME_ID: ${RUNPOD_NETWORK_VOLUME_ID:-}
      RUNPOD_WORKER_API_URL: ${RUNPOD_WORKER_API_URL:-}
      RUNPOD_WORKER_ENV: ${RUNPOD_WORKER_ENV:-KEEP_MODELS=8,INTERACTIVE_ONLY=1,WARMUP=1}
    # Logs hold no bodies or signed URLs (docs/PRIVACY.md); rotated, at most 100 MB.
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    volumes:
      - storage:/data/storage
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

  web:
    build: { context: .., dockerfile: deploy/api.Dockerfile, target: web }
    depends_on: { api: { condition: service_healthy } }
    ports: ["${PORT:-8000}:8000"]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  worker:
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    depends_on: [web]
    environment:
      API_URL: http://web:8000
      WORKER_TOKEN: ${WORKER_TOKEN}
      CACHE_MAX_GB: ${WORKER_CACHE_GB:-20}
      WORKER_REGION: ${WORKER_REGION:-}
    # One cache volume for all replicas: files by hash are shared, each worker links its own copies.
    volumes: [cache:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${WORKER_MEMORY:-6g}
    deploy: { replicas: "${WORKERS:-1}" }

volumes:
  db:
  storage:
  cache:
