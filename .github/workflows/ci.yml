name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions → CI → Run workflow (on main): tests, publish and deploy again without a new commit.
  workflow_dispatch:

jobs:
  api-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nc
          POSTGRES_PASSWORD: nc
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nc" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://nc:nc@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build (shared, API, web)
        run: npm run build
      - name: API tests
        run: npm test -w @neuracraft/api
      - name: Web tests (translations)
        run: npm test -w @neuracraft/web

  worker-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nc
          POSTGRES_PASSWORD: nc
          POSTGRES_DB: nc_e2e
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nc" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build the worker (engine at the pinned commit)
        run: cmake -S worker -B worker/build -DCMAKE_BUILD_TYPE=Release && cmake --build worker/build --parallel --target neuracraft-worker
      - run: npm ci --no-audit --no-fund && npm run build
      - name: End to end (API + worker + engine)
        env:
          DATABASE_URL: postgres://nc:nc@localhost:5432/nc_e2e
        run: node tests/e2e.mjs

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -f deploy/api.Dockerfile --target api -t neuracraft-api .
      - name: Web image
        run: docker build -f deploy/api.Dockerfile --target web -t neuracraft-web .
      - name: Worker image
        run: docker build -f deploy/worker.Dockerfile -t neuracraft-worker .
      - name: GPU worker image (CUDA)
        run: docker build -f deploy/worker-gpu.Dockerfile --build-arg CUDA_ARCHS=86 -t neuracraft-worker-gpu .

  # The images production runs (deploy/production), published from main: the API, the web app (Caddy)
  # and the GPU worker the capacity manager's pods run (RUNPOD_IMAGE), all tagged with the commit.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [api-web, worker-e2e, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          OWNER=ghcr.io/${{ github.repository_owner }}
          SRC="--label org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          build() {  # image, then docker build arguments
            local image=$OWNER/$1; shift
            docker build $SRC -t "$image:${{ github.sha }}" -t "$image:latest" "$@" .
            push "$image:${{ github.sha }}"
            push "$image:latest"
          }
          push() {  # GHCR sometimes answers "denied" right after creating a package: retry
            for i in 1 2 3 4; do docker push "$1" && return 0; sleep $((i * 15)); done
            return 1
          }
          build neuracraft-cloud-api -f deploy/api.Dockerfile --target api
          build neuracraft-cloud-web -f deploy/api.Dockerfile --target web
          build neuracraft-worker-gpu -f deploy/worker-gpu.Dockerfile --build-arg CUDA_ARCHS="86;89;120"

  # Production (docs/DEPLOY.md): copies deploy/production to the server and starts this commit's images.
  # Skipped until the DEPLOY_HOST and DEPLOY_SSH_KEY secrets exist.
  deploy:
    needs: [publish]
    runs-on: ubuntu-latest
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
      - name: Deploy
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@$DEPLOY_HOST"
          printf 'RUNPOD_API_KEY=%s\nANTHROPIC_API_KEY=%s\nADMIN_TOKEN=%s\n' "$RUNPOD_API_KEY" "$ANTHROPIC_API_KEY" "$ADMIN_TOKEN" > secrets.env
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/production/{docker-compose.yml,Caddyfile,settings.env,deploy.sh} secrets.env "deploy@$DEPLOY_HOST:/opt/neuracraft/"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/catalog/sketch-to-scene.sh "deploy@$DEPLOY_HOST:/opt/neuracraft/catalog-sketch-to-scene.sh"
          rm secrets.env
          echo "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null"
          if $SSH "TAG=${{ github.sha }} bash /opt/neuracraft/deploy.sh"; then status=0; else status=$?; fi
          $SSH "docker logout ghcr.io > /dev/null" || true
          exit $status
